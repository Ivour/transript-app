<!doctype html>
<html lang="cs" data-theme="dark"><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="type.css"><link rel="stylesheet" href="../reference.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:var(--canvas)}body{padding:24px;display:flex;justify-content:center}</style></head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-usage" viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-9" stroke-width="2.6"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4M20 12H9"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
<symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 20v-3M10 20v-7M15 20V9M20 20V4" stroke-width="2.4"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>
</defs></svg><div class="ll-stage" data-demo data-rec="0" style="width:366px;display:flex;flex-direction:column;gap:16px;padding:12px"><div class="ll-controls"><button class="ll-start" data-state="idle"><span class="ll-start-idle button-label"><svg class="ic ic-lg"><use href="#i-mic"/></svg>Start</span><span class="ll-start-rec button-label"><svg class="ic ic-lg"><use href="#i-stop"/></svg>Stop</span></button></div><div class="ll-controls"><button class="ll-start" data-state="recording"><span class="ll-start-idle button-label"><svg class="ic ic-lg"><use href="#i-mic"/></svg>Start</span><span class="ll-start-rec button-label"><svg class="ic ic-lg"><use href="#i-stop"/></svg>Stop</span></button></div></div><script>
document.querySelectorAll('[data-demo]').forEach(function(root){
  var f=root.querySelector('.ll-feed'); if(f) f.scrollTop=f.scrollHeight;
  var th=document.documentElement.getAttribute('data-theme')||'light';
  root.querySelectorAll('.ll-seg').forEach(function(seg){seg.dataset.value=th;seg.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-checked',String(x.dataset.v===th))})});
  var start=root.querySelector('.ll-start'), timer=root.querySelector('[data-timer]'), secs=timer?parseInt(timer.dataset.start||'0',10):0;
  function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  setInterval(function(){ if(timer && root.dataset.rec==='1'){secs++;timer.textContent=fmt(secs)} },1000);
  if(start) start.addEventListener('click',function(){var rec=start.dataset.state==='recording';start.dataset.state=rec?'idle':'recording';root.dataset.rec=rec?'0':'1';if(!rec){secs=0;if(timer)timer.textContent='00:00'}});
  root.querySelectorAll('.ll-switch').forEach(function(sw){sw.addEventListener('click',function(){var on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',on);if(sw.dataset.role==='signal'){root.dataset.signal=on?'low':'ok'}})});
  root.querySelectorAll('.ll-seg').forEach(function(seg){seg.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){seg.dataset.value=b.dataset.v;seg.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-checked',String(x===b))});document.documentElement.setAttribute('data-theme',b.dataset.v)})})});
  root.querySelectorAll('[data-act=theme]').forEach(function(b){b.addEventListener('click',function(){var h=document.documentElement;h.setAttribute('data-theme',(h.getAttribute('data-theme')||'dark')==='dark'?'light':'dark')})});
  root.querySelectorAll('[data-act=signal]').forEach(function(b){b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);root.dataset.signal=on?'low':'ok'})});
  var ts=19, tgt=root.querySelector('.ll-feed')||root;
  root.querySelectorAll('.ll-step button').forEach(function(b){b.addEventListener('click',function(){ts=Math.max(15,Math.min(27,ts+(+b.dataset.d)));tgt.style.setProperty('--ts',ts+'px');root.querySelectorAll('.ll-step button').forEach(function(x){x.disabled=(+x.dataset.d<0&&ts<=15)||(+x.dataset.d>0&&ts>=27)});if(f)setTimeout(function(){f.scrollTop=f.scrollHeight},230)})});
  root.querySelectorAll('.ll-meter').forEach(function(m){var cur=parseFloat(getComputedStyle(m).getPropertyValue('--lvl'))||0,tg=cur;
    setInterval(function(){var on=root.dataset.rec==='1'||!root.querySelector('.ll-start');tg=on?(Math.random()<.15?8+Math.random()*12:30+Math.random()*60):0},140);
    (function tick(){cur+=(tg-cur)*.18;m.style.setProperty('--lvl',cur.toFixed(1)+'%');requestAnimationFrame(tick)})();});
  root.querySelectorAll('.ll-range').forEach(function(rg){function u(){rg.parentNode.style.setProperty('--p',rg.value+'%');var v=rg.parentNode.querySelector('.val');if(v)v.textContent=rg.value+' %'}rg.addEventListener('input',u);u()});
});
</script></body></html>
