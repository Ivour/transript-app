<!doctype html>
<html lang="cs" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch / home indicator; the app
         pads itself with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Updated at runtime by useTheme (dark is the default theme). -->
    <meta name="theme-color" content="#0a0c0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, not `black-translucent`: iOS draws its own solid status bar
         and the page starts below it. With `black-translucent` the page ran
         under the status bar, where iOS blurred the header icons, and 100dvh
         came out short by the status bar height right after launch (a gap
         under the dock until the first scroll). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="livelife" />
    <title>livelife</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
